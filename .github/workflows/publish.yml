name: Publish

# Started by hand. There is deliberately no automatic publish on merge: a
# published version cannot be recalled fast enough that nobody has installed
# it, so "this version goes out" has to be its own decision.
on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Publishing is irreversible. Configure the `npm` environment with a
    # required reviewer in the repository settings to gate it.
    environment: npm
    permissions:
      contents: write # push tags
      id-token: write # npm provenance
    outputs:
      tags: ${{ steps.tags.outputs.list }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Repository rules
        run: pnpm repo:check

      # Before publishing, because publishing is what creates the tags.
      #
      # `changeset publish` tags with `git tag <name> -m <name>` — an annotated
      # tag, which needs a committer. Without these two lines the command
      # fails, changesets does not check its exit code, and the log is left
      # with a cheerful `New tag:` and no tag at all.
      - name: Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Publish
        # Provenance signs an attestation linking each tarball to this workflow
        # run; it needs the id-token permission above and a public repository.
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Provenance is easy to lose and silent when lost.
      #
      # The first release set NPM_CONFIG_PROVENANCE in the job environment and
      # the packages still went out unattested: `changeset publish` spawns
      # pnpm, and the variable did not survive the hop. `provenance=true` in
      # the committed .npmrc is the fix, but nothing about it is visible until
      # a tarball is already on npm — so check the registry and say so.
      #
      # A warning rather than a failure: the packages are published by now, and
      # failing here would not un-publish them.
      - name: Verify provenance landed
        run: |
          missing=0
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$version" dist.attestations --json 2>/dev/null | grep -q .; then
              echo "  $name@$version: attested"
            else
              echo "::warning::$name@$version published without a provenance attestation"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning::$missing package(s) lack provenance. Check that provenance=true in .npmrc reaches pnpm, and that this job has id-token: write."
          fi

      # --tags rather than --follow-tags: the tags sit on a commit that is
      # already pushed.
      - name: Push tags
        run: git push --tags

      - name: Collect the tags this run created
        id: tags
        run: |
          git tag --points-at HEAD \
            | jq -R -s -c 'split("\n") | map(select(length > 0))' \
            | sed 's/^/list=/' >> "$GITHUB_OUTPUT"

  release:
    name: GitHub Release
    needs: publish
    if: ${{ needs.publish.outputs.tags != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.publish.outputs.tags) }}

    steps:
      - uses: actions/checkout@v7

      - name: Extract the changelog section for this tag
        env:
          TAG: ${{ matrix.tag }}
        run: |
          # A changesets tag looks like @deniscuciuc/bnm@0.2.0.
          NAME="${TAG%@*}"       # @deniscuciuc/bnm
          VERSION="${TAG##*@}"   # 0.2.0
          FOLDER="${NAME##*/}"   # bnm
          CHANGELOG="packages/$FOLDER/CHANGELOG.md"

          if [ -f "$CHANGELOG" ]; then
            # awk reads the version from the environment rather than having it
            # interpolated into the program text, so a tag name is never run as
            # code. An exact string compare needs no escaping at all.
            awk -v v="$VERSION" '
              $0 == "## " v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$CHANGELOG" > /tmp/release-notes.md
          fi

          # Missing notes are a warning here, never an error.
          #
          # This job runs *after* the packages are on npm, and npm is the
          # irreversible half. Failing now un-publishes nothing — it only
          # withholds the release notes and leaves tags pushed with no
          # matching Release, which is a worse state than a thin Release.
          # The first publish hit exactly that: no package had a CHANGELOG.md
          # yet, because `changeset version` had never run.
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $TAG; publishing a minimal release body"
            {
              echo "\`$NAME@$VERSION\` is on npm:"
              echo "<https://www.npmjs.com/package/$NAME/v/$VERSION>"
              echo
              echo "No changelog section was found for this version."
            } > /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.tag }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          # Four independently versioned packages: there is no single "latest"
          # release for the repository.
          make_latest: false
